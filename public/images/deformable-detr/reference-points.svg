<text x="54" y="98" fill="#65758a" font-size="19" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">Encoder 的参考点来自网格中心；单阶段 Decoder 的初始参考点来自可学习 Query 的位置部分。</text>
